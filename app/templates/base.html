<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111236">
  <title>Berlari</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v={{ v }}">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ v }}">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <header>
    <a href="/" class="brand"><img src="/static/favicon.png?v={{ v }}" alt="">Berlari</a>
    {% if user %}<nav><a href="/new">New plan</a> <a href="/logout">Log out</a></nav>{% endif %}
  </header>
  <main>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>
    <picture>
      <source srcset="/static/strava-powered-white.svg" media="(prefers-color-scheme: dark)">
      <img class="powered" src="/static/strava-powered-black.svg" alt="Powered by Strava" height="16">
    </picture>
    <p><a href="/privacy">Privacy</a> · <a href="https://github.com/juanjosua/berlari">Source</a></p>
  </footer>
</body>
</html>
