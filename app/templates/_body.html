<fieldset class="body-fields">
  <legend>{{ t("About you") }} <span class="muted">{{ t("(helps make the plan safe for you)") }}</span></legend>
  <label>{{ t("Sex") }} <span class="muted">{{ t("(for calorie needs)") }}</span>
    <select name="sex"><option value="">–</option>
      <option value="M" {% if prefs.sex == "M" %}selected{% endif %}>{{ t("Male") }}</option>
      <option value="F" {% if prefs.sex == "F" %}selected{% endif %}>{{ t("Female") }}</option></select>
  </label>
  <label>{{ t("When do you eat rice?") }}
    <select name="rice">
      <option value="daily" {% if prefs.rice in (none, "daily") %}selected{% endif %}>{{ t("Every day") }}</option>
      <option value="weekend" {% if prefs.rice == "weekend" %}selected{% endif %}>{{ t("Only on weekends (at home)") }}</option>
      <option value="none" {% if prefs.rice == "none" %}selected{% endif %}>{{ t("Never") }}</option></select>
  </label>
  <label>{{ t("Food budget per weekday (Rp)") }} <span class="muted">{{ t("(optional)") }}</span>
    <input type="text" name="budget" inputmode="numeric" placeholder="40.000" value="{{ '{:,}'.format(prefs.budget).replace(',', '.') if prefs.budget else '' }}">
  </label>
  <div class="row3">
    <label>{{ t("Age") }}<input type="number" name="age" inputmode="numeric" min="10" max="100" value="{{ prefs.age or '' }}"></label>
    <label>{{ t("Height (cm)") }}<input type="number" name="height_cm" inputmode="decimal" min="120" max="230" step="0.1" value="{{ prefs.height_cm or '' }}"></label>
    <label>{{ t("Weight (kg)") }}<input type="number" name="weight_kg" inputmode="decimal" min="30" max="250" step="0.1" value="{{ prefs.weight_kg or '' }}"></label>
  </div>
  <p class="small muted">{{ t("Age sets your max heart rate (Tanaka formula; Strava doesn't share age). Height and weight let the plan build up more gently when needed. Only stored for your plan, never shared.") }}</p>
</fieldset>
